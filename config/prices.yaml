# Snapshot of OpenRouter's public price list taken on 2026-11-20. Prices change: check
# them against the live list before relying on an estimate. Names are OpenRouter model ids.
#
# reasoning_tokens_per_call is optional and is NOT in OpenRouter's list. Set it for a
# thinking model that spends hidden reasoning tokens on every call; they are billed at
# the output price and can dominate the cost.

